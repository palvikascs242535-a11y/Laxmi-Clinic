spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# In production, secure origins and detailed logging
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://laxmiclinic.com}

logging.level.root=WARN
logging.level.com.laxmiclinic=INFO
